apiVersion: v1
kind: ConfigMap
metadata:
  name: agentforce-config
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce
    app.kubernetes.io/part-of: agentforce-platform
data:
  APP_ENV: "production"
  PORT: "8000"
  FRONTEND_URL: "https://agentforce.local"
  DATABASE_URL: "sqlite+aiosqlite:////app/storage/agentforce.db"
  REDIS_URL: "redis://agentforce-redis:6379/0"
  QDRANT_HOST: "agentforce-qdrant"
  QDRANT_PORT: "6333"
  DEFAULT_LLM_PROVIDER: "gemini"
  DEFAULT_MODEL: "gemini/gemini-1.5-flash"
  LOG_LEVEL: "INFO"
  ENABLE_PROMETHEUS: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

