version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforce-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      - redis
      - qdrant
      - rabbitmq
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentforce-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforce-worker
    command: python -m app.workers.event_consumer
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      - redis
      - rabbitmq
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentforce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: agentforce-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: agentforce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: agentforce-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  mock-services:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforce-mock-services
    command: python -m mock_services.main
    ports:
      - "8100:8100"
      - "8101:8101"
      - "8102:8102"
      - "8103:8103"
    env_file:
      - .env
    restart: unless-stopped

  # Optional local Postgres for offline development if Supabase DB is not reachable
  postgres:
    image: postgres:16-alpine
    container_name: agentforce-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentforce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - local-db
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  rabbitmq_data:
  postgres_data:

