apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforce-backend
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforce-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentforce-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: agentforce/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: agentforce-config
            - secretRef:
                name: agentforce-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: persistent-storage
              mountPath: /app/storage
      volumes:
        - name: persistent-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentforce-backend
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: agentforce-backend
