apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentforce-ingress
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "agentforce-backend"
spec:
  rules:
    - host: agentforce.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentforce-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: agentforce-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: agentforce-backend
                port:
                  number: 8000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: agentforce-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentforce-frontend
                port:
                  number: 3000
