apiVersion: v1
kind: Secret
metadata:
  name: agentforce-secrets
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce
    app.kubernetes.io/part-of: agentforce-platform
type: Opaque
stringData:
  # Base64 encoded or stringData values for production deployment
  JWT_SECRET: "replace-with-a-secure-random-secret-key-min-32-chars"
  GEMINI_API_KEY: "replace-with-google-gemini-api-key"
  GROQ_API_KEY: "replace-with-groq-cloud-api-key"
  QDRANT_API_KEY: ""
