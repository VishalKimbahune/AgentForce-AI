apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforce-frontend
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforce-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentforce-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: agentforce/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://agentforce-backend:8000"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: agentforce-frontend
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: agentforce-frontend
