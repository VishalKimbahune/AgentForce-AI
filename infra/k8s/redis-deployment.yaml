apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentforce-redis
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentforce-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentforce-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentforce-redis
  namespace: agentforce
  labels:
    app.kubernetes.io/name: agentforce-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: agentforce-redis
